name: Sync Prompts

# Manual-only sync of prompts/<orchestrator>/<version>.md into the `prompts` DB
# table (the orchestrators load the active prompt from the DB at runtime, so
# editing a prompt file only takes effect after this sync). Trigger from the
# Actions tab ("Run workflow").
#
# Required repo secrets:
#   NEXT_PUBLIC_SUPABASE_URL    — project URL (Supabase dashboard > Settings > API)
#   SUPABASE_SERVICE_ROLE_KEY   — service role key (server-only; never client)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync regular prompts or stage the signed copy-brain candidate'
        required: true
        default: sync
        type: choice
        options:
          - sync
          - brain-stage
          - brain-release
          - brain-restore-scope
          - brain-smoke

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync prompts
        if: ${{ github.event.inputs.mode == 'sync' }}
        run: pnpm prompts:sync

      - name: Stage signed copy-brain prompts inactive
        if: ${{ github.event.inputs.mode == 'brain-stage' }}
        run: pnpm brain:stage -- --package brain-release/manifest.json

      - name: Activate the owner-approved signed copy brain
        if: ${{ github.event.inputs.mode == 'brain-release' }}
        run: >-
          pnpm brain:release --
          --package brain-release/manifest.json
          --confirm-owner-approved
          --confirm-eight-case-eval-deferred

      - name: Preserve rollback snapshot
        if: ${{ github.event.inputs.mode == 'brain-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: copy-brain-rollback-${{ github.run_id }}
          path: brain-release/rollback-copy-brain-release-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Restore prompts outside the copy department
        if: ${{ github.event.inputs.mode == 'brain-restore-scope' }}
        run: pnpm brain:restore-scope -- --confirm-scope-repair

      - name: Run one controlled LeadEcho system smoke
        if: ${{ github.event.inputs.mode == 'brain-smoke' }}
        run: pnpm exec tsx scripts/smoke-copy-brain-v331.mts

      - name: Preserve smoke trace
        if: ${{ always() && github.event.inputs.mode == 'brain-smoke' }}
        uses: actions/upload-artifact@v4
        with:
          name: copy-brain-smoke-${{ github.run_id }}
          path: copy-brain-v331-smoke-result.json
          if-no-files-found: error
          retention-days: 90
