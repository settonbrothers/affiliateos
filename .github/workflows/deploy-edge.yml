name: Deploy Edge Functions

# Manual-only deploy of Supabase edge functions. Edge deploys were previously
# only done by hand (`supabase functions deploy <name>`); this gives a
# repeatable, audited path. Trigger from the Actions tab ("Run workflow") and
# optionally name a single function, or leave blank to deploy all.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN  — personal access token (Supabase dashboard > Account)
#   SUPABASE_PROJECT_REF   — pfuwahtntsnlprjqlwcn
on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Single function to deploy (blank = all)'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge function(s)
        run: |
          REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          FN="${{ github.event.inputs.function }}"
          if [ "$FN" = "__copy_eval_db_check__" ]; then
            node -e 'const run = async () => { const query = "select json_build_object('\''migrations'\'', (select coalesce(json_agg(json_build_object('\''version'\'', version, '\''name'\'', name) order by version), '\''[]'\''::json) from supabase_migrations.schema_migrations where version >= '\''0040'\''), '\''migration_columns'\'', (select coalesce(json_agg(column_name order by ordinal_position), '\''[]'\''::json) from information_schema.columns where table_schema = '\''supabase_migrations'\'' and table_name = '\''schema_migrations'\''), '\''copy_eval_cases_exists'\'', to_regclass('\''public.copy_eval_cases'\'') is not null, '\''offer_economics_exists'\'', to_regclass('\''public.offer_economics'\'') is not null, '\''negative_spend_rows'\'', (select count(*) from public.campaign_results where spend_usd < 0), '\''negative_revenue_rows'\'', (select count(*) from public.campaign_results where revenue_usd < 0)) as preflight"; const response = await fetch(`https://api.supabase.com/v1/projects/${process.env.PROJECT_REF}/database/query/read-only`, { method: "POST", headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`, "content-type": "application/json" }, body: JSON.stringify({ query }) }); const body = await response.text(); console.log(`Database migration check: HTTP ${response.status}`); console.log(body); if (!response.ok) process.exit(1) }; run()'
          elif [ -n "$FN" ]; then
            supabase functions deploy "$FN" --project-ref "$REF"
          else
            for dir in supabase/functions/*/; do
              name="$(basename "$dir")"
              # Skip shared, non-deployable directories.
              case "$name" in
                _shared) continue ;;
              esac
              echo "Deploying $name"
              supabase functions deploy "$name" --project-ref "$REF"
            done
          fi
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
